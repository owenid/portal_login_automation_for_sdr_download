AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Monthly Lambda that logs into the Gradwell SSO/Admin portal, navigates to
  the SDR section, downloads the CDR file, and stores it in S3.

Parameters:
  ScheduleExpression:
    Type: String
    Default: "cron(0 6 1 * ? *)"
    Description: >
      When the download job runs. Default is 06:00 UTC on the 1st of every
      month.

Resources:
  CdrBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDebugScreenshots
            Prefix: debug/
            Status: Enabled
            ExpirationInDays: 30

  CredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: >
        Gradwell portal login credentials. After deploy, set the
        SecretString to {"username": "...", "password": "..."} via the
        console or:
        aws secretsmanager put-secret-value --secret-id <arn> --secret-string '{"username":"...","password":"..."}'
      Name: !Sub "${AWS::StackName}/gradwell-portal-credentials"

  CdrDownloaderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/index.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 2048
      Timeout: 180
      EphemeralStorage:
        Size: 1024
      Environment:
        Variables:
          CDR_BUCKET_NAME: !Ref CdrBucket
          CREDENTIALS_SECRET_ARN: !Ref CredentialsSecret
          SSO_URL: "https://sso.pro.gradwell.com"
          ADMIN_HOME_URL: "https://admin.prod.gradwell.com/home"
          SDR_URL: "https://admin.prod.gradwell.com/sdrs"
          DEBUG_SCREENSHOTS: "false"
      Policies:
        - S3WritePolicy:
            BucketName: !Ref CdrBucket
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref CredentialsSecret
      Events:
        MonthlySchedule:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Name: !Sub "${AWS::StackName}-monthly-cdr-download"
            Description: Triggers the CDR download on the 1st of every month
            Enabled: true

Outputs:
  CdrBucketName:
    Description: S3 bucket where downloaded CDR files (and debug screenshots) are stored
    Value: !Ref CdrBucket
  CredentialsSecretArn:
    Description: Secrets Manager secret to populate with {"username", "password"}
    Value: !Ref CredentialsSecret
  CdrDownloaderFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt CdrDownloaderFunction.Arn
