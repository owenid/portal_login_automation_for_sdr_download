AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Monthly Lambda that logs into the Gradwell SSO/Admin portal, navigates to
  the SDR section, downloads the CDR file, and stores it in S3.

Parameters:
  ScheduleExpression:
    Type: String
    Default: "cron(0 9 1 * ? *)"
    Description: >
      When the download job runs, evaluated in the timezone named by
      ScheduleTimezone (not UTC). Default is 09:00 on the 1st of every
      month. Runs via AWS EventBridge Scheduler rather than a classic
      EventBridge Rule specifically so this can be a fixed local time —
      classic EventBridge cron rules are UTC-only and have no
      daylight-saving awareness.

  ScheduleTimezone:
    Type: String
    Default: "Europe/London"
    Description: >
      IANA timezone ScheduleExpression is evaluated in. EventBridge
      Scheduler applies daylight-saving transitions for this zone
      automatically, so the default keeps the run fixed at 09:00 UK local
      time year-round (09:00 GMT in winter, 09:00 BST in summer) without
      needing to adjust the cron expression twice a year.

  CredentialsSecretName:
    Type: String
    Default: "prod/AdminPortal/Gradwell"
    Description: >
      Name of the pre-existing Secrets Manager secret holding
      {"username": "...", "password": "..."} for the Gradwell portal. This
      stack does not create or manage the secret's value — populate it
      yourself before (or after) deploying.

  DebugScreenshots:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Set to "true" to upload a screenshot to S3 after every automation
      step (debug/<run-id>/<step>.png), for tuning selectors. Managed here
      (rather than via `aws lambda update-function-configuration`) so it
      survives future `sam deploy` runs instead of being silently reset to
      the template's default.

  DatadogForwarderTopicArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:sns:[a-z0-9-]+:\\d{12}:.+$"
    ConstraintDescription: Must be empty, or a full SNS topic ARN, e.g. arn:aws:sns:eu-west-2:123456789012:datadog-forwarder-topic
    Description: >
      ARN of the Datadog Forwarder's SNS topic. Optional — leave empty (the
      default) to deploy without Datadog alerting; the CloudWatch alarm
      still exists and is visible in the console/CLI, it just has no
      AlarmActions/OKActions until this is set. This stack does not create
      or manage that topic — once your Datadog Forwarder is deployed,
      supply its ARN via --parameter-overrides
      DatadogForwarderTopicArn=<arn> to wire up notifications.

  LogRetentionInDays:
    Type: Number
    Default: 400
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: >
      How long CloudWatch Logs keeps the function's logs. The default (400
      days) keeps every monthly run for just over a year, so a failure can
      be compared with the same month last year.

  MinCdrFileBytes:
    Type: Number
    Default: 1024
    MinValue: 1
    Description: >
      A CDR file smaller than this many bytes is treated as headers only.
      Used by the monthly delivery check and by the file-too-small alarm.
      The header-only file seen on 13 Sep 2026 was 237 bytes.

Conditions:
  HasDatadogForwarderTopicArn: !Not [!Equals [!Ref DatadogForwarderTopicArn, ""]]

Resources:
  CdrBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireDebugScreenshots
            Prefix: debug/
            Status: Enabled
            ExpirationInDays: 30

  # The function's log group, created here so its retention is managed by
  # the stack. It has its own name rather than Lambda's default
  # /aws/lambda/<function name>: that group already existed (Lambda creates
  # it on first run), and CloudFormation can't take over an existing log
  # group in a normal deploy. Retained on stack deletion so run history
  # isn't lost with the stack.
  CdrDownloaderLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}"
      RetentionInDays: !Ref LogRetentionInDays

  CdrDownloaderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/index.handler
      Runtime: nodejs22.x
      Architectures:
        - x86_64
      MemorySize: 2048
      Timeout: 180
      EphemeralStorage:
        Size: 1024
      LoggingConfig:
        LogGroup: !Ref CdrDownloaderLogGroup
        # Plain-text lines (timestamp, request ID, level, message), which the
        # CloudWatch commands in the README and docs rely on.
        LogFormat: Text
      Environment:
        Variables:
          CDR_BUCKET_NAME: !Ref CdrBucket
          CREDENTIALS_SECRET_ID: !Ref CredentialsSecretName
          SSO_URL: "https://sso.prod.gradwell.com"
          ADMIN_HOME_URL: "https://admin.prod.gradwell.com/home"
          CDR_URL: "https://admin.prod.gradwell.com/cdrs"
          DEBUG_SCREENSHOTS: !Ref DebugScreenshots
          MIN_CDR_FILE_BYTES: !Ref MinCdrFileBytes
      Policies:
        - Statement:
            # Prefix-scoped rather than SAM's S3WritePolicy (which grants
            # write access to the entire bucket): the code only ever writes
            # to cdr/ (the downloaded CDR file) and debug/ (optional
            # screenshots), so the permission is limited to exactly those
            # two prefixes and to the one action (PutObject) actually used.
            - Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub "${CdrBucket.Arn}/cdr/*"
                - !Sub "${CdrBucket.Arn}/debug/*"
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              # Secrets Manager appends a random 6-character suffix to the
              # ARN of every secret, so the trailing "*" is required to
              # match the real ARN of the pre-existing secret named above.
              Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${CredentialsSecretName}*"
            # Custom monitoring metrics. PutMetricData has no resource-level
            # permissions, so it is limited to the one namespace instead.
            - Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: "*"
              Condition:
                StringEquals:
                  cloudwatch:namespace: CdrDownloader
            # The monthly delivery check lists this month's cdr/ prefix.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt CdrBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: "cdr/*"

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeCdrDownloaderFunction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CdrDownloaderFunction.Arn

  MonthlyCdrDownloadSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-monthly-cdr-download"
      Description: >
        Triggers the CDR download at a fixed local time (see
        ScheduleTimezone), DST-aware via AWS EventBridge Scheduler.
      ScheduleExpression: !Ref ScheduleExpression
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt CdrDownloaderFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn

  CdrDownloaderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-lambda-errors"
      AlarmDescription: >
        Fires when the monthly CDR download Lambda reports at least one
        error. The function only runs once a month via schedule, so this
        uses a 1-day evaluation period with TreatMissingData: notBreaching
        — a day with no invocation reads as "no data", not an error, and
        only the scheduled run day can actually trip this alarm.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CdrDownloaderFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasDatadogForwarderTopicArn, [!Ref DatadogForwarderTopicArn], []]
      OKActions: !If [HasDatadogForwarderTopicArn, [!Ref DatadogForwarderTopicArn], []]

  # Runs the same function in "deliveryCheck" mode 90 minutes after the
  # monthly download, to confirm a usable file actually arrived. Catches a
  # run that never started and a header-only file, which the Errors alarm
  # can't see.
  MonthlyCdrDeliveryCheckSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${AWS::StackName}-monthly-delivery-check"
      Description: >
        Checks at 10:30 local time (see ScheduleTimezone) on the 1st that
        this month's CDR file is in S3 and at least MinCdrFileBytes.
      ScheduleExpression: "cron(30 10 1 * ? *)"
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt CdrDownloaderFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn
        Input: '{"mode":"deliveryCheck"}'

  CdrDeliveryMissingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-delivery-missing"
      AlarmDescription: >
        No CDR file of at least MinCdrFileBytes in S3 by the 10:30 delivery
        check on the 1st: the run never started, every attempt failed, or
        the file was headers only.
      Namespace: CdrDownloader
      MetricName: DeliveryCheck
      Statistic: Minimum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasDatadogForwarderTopicArn, [!Ref DatadogForwarderTopicArn], []]
      OKActions: !If [HasDatadogForwarderTopicArn, [!Ref DatadogForwarderTopicArn], []]

  CdrFileTooSmallAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-file-too-small"
      AlarmDescription: >
        A run saved a CDR file smaller than MinCdrFileBytes (likely headers
        only). Also fires for manual re-runs after the 1st.
      Namespace: CdrDownloader
      MetricName: FileSizeBytes
      Statistic: Minimum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref MinCdrFileBytes
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasDatadogForwarderTopicArn, [!Ref DatadogForwarderTopicArn], []]
      OKActions: !If [HasDatadogForwarderTopicArn, [!Ref DatadogForwarderTopicArn], []]

  # The five monitoring metrics plus alarm status, over 400 days at a 1-day
  # period so each monthly run is one point.
  CdrDownloaderDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}"
      DashboardBody: !Sub |
        {
          "start": "-P400D",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "metric", "x": 0, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "1 · Invocations (did the schedule fire?)",
                "region": "${AWS::Region}", "view": "bar", "stat": "Sum", "period": 86400,
                "metrics": [["AWS/Lambda", "Invocations", "FunctionName", "${CdrDownloaderFunction}"]]
              }
            },
            {
              "type": "metric", "x": 8, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "2 · Errors (did the run fail?)",
                "region": "${AWS::Region}", "view": "bar", "stat": "Sum", "period": 86400,
                "metrics": [["AWS/Lambda", "Errors", "FunctionName", "${CdrDownloaderFunction}"]]
              }
            },
            {
              "type": "metric", "x": 16, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "4 · Duration, max ms (timeout is 180,000)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Maximum", "period": 86400,
                "metrics": [["AWS/Lambda", "Duration", "FunctionName", "${CdrDownloaderFunction}"]],
                "annotations": { "horizontal": [
                  { "label": "Investigate", "value": 120000 },
                  { "label": "Timeout", "value": 180000 }
                ] }
              }
            },
            {
              "type": "metric", "x": 0, "y": 6, "width": 16, "height": 6,
              "properties": {
                "title": "3 · Failures by error code",
                "region": "${AWS::Region}", "view": "bar", "stacked": true, "period": 86400,
                "metrics": [[{ "expression": "SEARCH('{CdrDownloader,Code} MetricName=\"Failures\"', 'Sum', 86400)", "id": "e1" }]]
              }
            },
            {
              "type": "metric", "x": 16, "y": 6, "width": 8, "height": 6,
              "properties": {
                "title": "5 · CDR file size, bytes",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Minimum", "period": 86400,
                "metrics": [["CdrDownloader", "FileSizeBytes"]],
                "annotations": { "horizontal": [{ "label": "Headers only below", "value": ${MinCdrFileBytes} }] }
              }
            },
            {
              "type": "alarm", "x": 0, "y": 12, "width": 16, "height": 3,
              "properties": {
                "title": "Alarm status",
                "alarms": [
                  "${CdrDownloaderErrorsAlarm.Arn}",
                  "${CdrDeliveryMissingAlarm.Arn}",
                  "${CdrFileTooSmallAlarm.Arn}"
                ]
              }
            },
            {
              "type": "text", "x": 16, "y": 12, "width": 8, "height": 3,
              "properties": {
                "markdown": "**Gradwell CDR download.** Runs 09:00 UK on the 1st; delivery check 10:30. Error codes: see CDR-Downloader-Error-Codes.docx in the repository."
              }
            }
          ]
        }

Outputs:
  CdrBucketName:
    Description: S3 bucket where downloaded CDR files (and debug screenshots) are stored
    Value: !Ref CdrBucket
  CredentialsSecretNameUsed:
    Description: >
      Pre-existing Secrets Manager secret the function reads
      {"username", "password"} from
    Value: !Ref CredentialsSecretName
  CdrDownloaderFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt CdrDownloaderFunction.Arn
  CdrDownloaderErrorsAlarmArn:
    Description: CloudWatch alarm ARN watching this function's Errors metric
    Value: !GetAtt CdrDownloaderErrorsAlarm.Arn
  MonthlyCdrDownloadScheduleArn:
    Description: >
      EventBridge Scheduler schedule ARN that triggers the download at a
      fixed local time (see ScheduleTimezone)
    Value: !GetAtt MonthlyCdrDownloadSchedule.Arn
  CdrDownloaderLogGroupName:
    Description: CloudWatch Logs log group the function writes to
    Value: !Ref CdrDownloaderLogGroup
  CdrDownloaderDashboardName:
    Description: CloudWatch dashboard with the five monitoring metrics and alarm status
    Value: !Ref CdrDownloaderDashboard
